<script>
  let currentClientPage = 1;
  let currentSalonSettings = {
    confirmationLinksEnabled: true,
    finalReminderEnabled: true
  };

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  document.addEventListener("DOMContentLoaded", function () {
    setupTabs();

    setupDaySelector();

    setupClientSearch();

    removeWarning();

    initPollToggle();

    loadAppointments("tomorrow");
  });

  function initPollToggle() {
    google.script.run
      .withSuccessHandler(updatePollToggleUI)
      .withFailureHandler(function (err) {
        console.error("Errore caricamento stato conferma 1-clic:", err);
      })
      .getConfirmationLinksEnabled();
  }

  function updatePollToggleUI(isEnabled) {
    const btn = document.getElementById("poll-toggle-btn");
    const statusText = document.getElementById("poll-toggle-status");
    if (!btn || !statusText) return;
    btn.disabled = false;
    if (isEnabled) {
      btn.className = "poll-toggle-btn active";
      statusText.textContent = "Attivo";
    } else {
      btn.className = "poll-toggle-btn inactive";
      statusText.textContent = "Disattivo";
    }
  }

  function togglePollReminders() {
    const btn = document.getElementById("poll-toggle-btn");
    const statusText = document.getElementById("poll-toggle-status");
    if (!btn) return;
    const isCurrentlyActive = btn.classList.contains("active");
    btn.disabled = true;
    if (statusText) statusText.textContent = "Aggiornamento...";
    google.script.run
      .withSuccessHandler(updatePollToggleUI)
      .withFailureHandler(function (err) {
        showError("reminders-content", "Errore aggiornamento impostazione conferma 1-clic: " + (err.message || err));
        updatePollToggleUI(isCurrentlyActive);
      })
      .setConfirmationLinksEnabled(!isCurrentlyActive);
  }

  function removeWarning() {
    const el = document.getElementById("warning");
    if (el) {
      el.style.display = "none";
    } else {
      setTimeout(removeWarning, 100);
    }
  }

  function setupTabs() {
    const tabs = document.querySelectorAll(".tab");
    tabs.forEach((tab) => {
      tab.addEventListener("click", function () {
        if (this.classList.contains("active")) return;

        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-content")
          .forEach((c) => c.classList.remove("active"));

        const settingsBtn = document.getElementById("open-settings-btn");
        if (settingsBtn) settingsBtn.classList.remove("active");

        this.classList.add("active");
        const tabName = this.getAttribute("data-tab");
        document.getElementById(`${tabName}-tab`).classList.add("active");

        if (tabName === "reminders") {
          const selectedDay =
            document
              .querySelector(".day-option.selected")
              .getAttribute("data-day") || "tomorrow";
          loadAppointments(selectedDay);
        } else if (tabName === "clients") {
          const searchTerm = document
            .getElementById("client-search")
            .value.trim();
          if (searchTerm) {
            searchClients(searchTerm);
          } else {
            loadClients(currentClientPage || 1);
          }
        }
      });
    });
  }

  function setupDaySelector() {
    const dayOptions = document.querySelectorAll(".day-option");
    dayOptions.forEach((option) => {
      option.addEventListener("click", function () {
        if (this.classList.contains("selected")) return;

        dayOptions.forEach((opt) => opt.classList.remove("selected"));
        this.classList.add("selected");
        loadAppointments(this.getAttribute("data-day"));
      });
    });
  }

  function setupClientSearch() {
    const searchButton = document.getElementById("search-button");
    const searchInput = document.getElementById("client-search");

    searchButton.addEventListener("click", function () {
      const searchTerm = searchInput.value.trim();
      currentClientPage = 1;
      searchClients(searchTerm);
    });

    searchInput.addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        searchButton.click();
      }
    });

    searchInput.addEventListener("input", function () {});
  }

  function showLoading(elementId, message = "Caricamento...") {
    const element = document.getElementById(elementId);
    if (element) element.innerHTML = `<div class="loading">${message}</div>`;
  }

  function showError(elementId, error) {
    const element = document.getElementById(elementId);
    let errorMessage = "Si è verificato un errore.";
    if (error && typeof error === "object" && error.message) {
      errorMessage += `<br><small>${error.message}</small>`;
    } else if (typeof error === "string") {
      errorMessage += `<br><small>${error}</small>`;
    }
    if (element)
      element.innerHTML = `<div class="error-feedback">${errorMessage}</div>`;
    console.error("Errore:", error);
  }

  function loadAppointments(day) {
    showLoading(
      "reminders-content",
      `Caricamento appuntamenti per ${
        day === "today" ? "oggi" : day === "tomorrow" ? "domani" : "dopodomani"
      }...`
    );
    google.script.run
      .withSuccessHandler(updateRemindersContent)
      .withFailureHandler((error) => showError("reminders-content", error))
      .getReminderDataForDay(day);
  }

  function updateRemindersContent(data) {
    const contentDiv = document.getElementById("reminders-content");
    document.getElementById("update-time").textContent =
      new Date().toLocaleString();

    if (data && data.error) {
      showError("reminders-content", data.error);
      return;
    }

    if (!data || data.length === 0) {
      contentDiv.innerHTML =
        '<p class="empty-state">Nessun appuntamento trovato per questo giorno.</p>';
      return;
    }

    let html = "<ul>";
    data.forEach((app) => {
      const isSent = app.sent;
      const safeId = escapeHtml(app.id);
      const safeLink = escapeHtml(app.link);
      const hasPhone = Boolean(app.link);
      const showConfirmBtn = hasPhone && (app.confirmationLinksEnabled !== undefined ? app.confirmationLinksEnabled : (currentSalonSettings.confirmationLinksEnabled !== false));
      const showReminderBtn = hasPhone && (app.finalReminderEnabled !== undefined ? app.finalReminderEnabled : (currentSalonSettings.finalReminderEnabled !== false));
      const hasAnyButton = showConfirmBtn || showReminderBtn;

      html += `
    <li class="${hasPhone ? "" : "no-link"} ${
        isSent ? "sent-item" : ""
      }" id="event-${safeId}">
    <div class="appointment-info">
      <strong>${escapeHtml(app.name)}</strong>
      <div>${escapeHtml(app.date)} alle ${escapeHtml(app.time)}</div>
    </div>
    <div class="action-area">
      ${
        hasPhone
          ? (hasAnyButton
              ? `<div class="btn-actions-group">
                   ${showConfirmBtn ? `
                     <button type="button" class="btn-action-confirm" id="btn-confirm-${safeId}" onclick="handleWahaDirectSend(event, '${safeId}', 'confirm')" title="Invia richiesta di conferma 1-click">
                       <span class="material-symbols-outlined action-btn-icon">touch_app</span>
                       <span>1-Click Confirm</span>
                     </button>` : ''}
                   ${showReminderBtn ? `
                     <button type="button" class="btn-action-reminder" id="btn-reminder-${safeId}" onclick="handleWahaDirectSend(event, '${safeId}', 'reminder')" title="Invia promemoria di ricordo (senza link)">
                       <span class="material-symbols-outlined action-btn-icon">notifications</span>
                       <span>Ricordo</span>
                     </button>` : ''}
                 </div>`
              : '')
          : `<span class="error-message">Telefono non disponibile</span>`
      }
      ${
        hasPhone
          ? `<div class="checkbox-container">
                      <input type="checkbox" id="checkbox-${
                        safeId
                      }" class="done-checkbox"
                             data-id="${safeId}"
                             ${isSent ? "checked" : ""}
                             onchange="updateSentStatus('${
                               safeId
                             }', this.checked)">
                      <label for="checkbox-${
                        safeId
                      }" class="checkbox-label">Inviato</label>
                    </div>`
          : ``
      }
    </div>
  </li>
  `;
    });
    html += "</ul>";
    contentDiv.innerHTML = html;
  }

  let toastTimeout = null;
  function showToast(message, type) {
    let toast = document.getElementById("toast");
    if (!toast) {
      toast = document.createElement("div");
      toast.id = "toast";
      toast.className = "toast-notification";
      document.body.appendChild(toast);
    }

    if (toastTimeout) {
      clearTimeout(toastTimeout);
    }

    const toastType = type || "success";
    toast.className = "toast-notification " + toastType + " show";
    toast.textContent = message;

    toastTimeout = setTimeout(function () {
      toast.classList.remove("show");
    }, 3500);
  }

  function handleWahaDirectSend(event, eventId, type) {
    event.preventDefault();
    event.stopPropagation();

    const isConfirm = type !== 'reminder';
    const activeBtn = document.getElementById(isConfirm ? `btn-confirm-${eventId}` : `btn-reminder-${eventId}`);
    const otherBtn = document.getElementById(isConfirm ? `btn-reminder-${eventId}` : `btn-confirm-${eventId}`);

    if (activeBtn) {
      activeBtn.disabled = true;
      activeBtn.style.opacity = "0.6";
      activeBtn.dataset.originalHtml = activeBtn.innerHTML;
      activeBtn.innerHTML = `<span>Invio...</span>`;
    }
    if (otherBtn) {
      otherBtn.disabled = true;
    }

    google.script.run
      .withSuccessHandler((res) => {
        const typeLabel = isConfirm ? "Richiesta di conferma 1-Click" : "Promemoria di ricordo";
        const clientName = res && res.clientName ? res.clientName : "";
        const successMsg = clientName
          ? `✅ ${typeLabel} inviato a ${clientName}`
          : `✅ ${typeLabel} inviato con successo`;

        showToast(successMsg, "success");

        const checkbox = document.getElementById(`checkbox-${eventId}`);
        if (checkbox) checkbox.checked = true;

        if (activeBtn) {
          activeBtn.disabled = false;
          activeBtn.style.opacity = "1";
          activeBtn.innerHTML = `<span class="material-symbols-outlined action-btn-icon">check</span><span>Inviato!</span>`;
          setTimeout(() => {
            activeBtn.innerHTML = activeBtn.dataset.originalHtml || (isConfirm ? `<span class="material-symbols-outlined action-btn-icon">touch_app</span><span>1-Click Confirm</span>` : `<span class="material-symbols-outlined action-btn-icon">notifications</span><span>Ricordo</span>`);
          }, 2000);
        }
        if (otherBtn) {
          otherBtn.disabled = false;
        }
      })
      .withFailureHandler((err) => {
        const errorMsg = "❌ Errore invio WAHA: " + (err.message || err);
        showToast(errorMsg, "error");

        if (activeBtn) {
          activeBtn.disabled = false;
          activeBtn.style.opacity = "1";
          activeBtn.innerHTML = activeBtn.dataset.originalHtml || (isConfirm ? `<span class="material-symbols-outlined action-btn-icon">touch_app</span><span>1-Click Confirm</span>` : `<span class="material-symbols-outlined action-btn-icon">notifications</span><span>Ricordo</span>`);
        }
        if (otherBtn) {
          otherBtn.disabled = false;
        }
      })
      .sendSingleReminderViaWaha(eventId, type || 'confirm');
  }

  function handleWhatsAppClick(event, eventId, link) {
    event.preventDefault();
    event.stopPropagation();
    window.open(link, "_blank");

    const checkbox = document.getElementById(`checkbox-${eventId}`);
    if (checkbox && !checkbox.checked) {
      checkbox.checked = true;
      updateSentStatus(eventId, true);
    }
  }

  function updateSentStatus(eventId, isChecked) {
    console.log(`Aggiornamento stato per ${eventId}: ${isChecked}`);
    const listItem = document.getElementById(`event-${eventId}`);
    if (listItem) listItem.style.opacity = "0.6";

    google.script.run
      .withSuccessHandler((response) => {
        console.log(
          `Stato per ${eventId} aggiornato con successo: ${isChecked}`
        );
        if (listItem) {
          listItem.style.opacity = "1";
        }
      })
      .withFailureHandler((err) => {
        console.error(`Errore aggiornamento stato per ${eventId}:`, err);
        showError(
          "reminders-content",
          `Errore salvataggio stato "Fatto" per ${eventId}: ${
            err.message || err
          }`
        );

        const checkbox = document.getElementById(`checkbox-${eventId}`);
        if (checkbox) checkbox.checked = !isChecked;
        if (listItem) listItem.style.opacity = "1";
      })
      .updateSentStatus(eventId, isChecked);
  }

  function loadClients(page = 1) {
    currentClientPage = page;
    showLoading("clients-content", "Caricamento clienti...");
    document.getElementById("clients-pagination").innerHTML = "";

    google.script.run
      .withSuccessHandler(displayClients)
      .withFailureHandler((error) => showClientError(error))
      .getClientsPage(page);
  }

  function searchClients(searchTerm) {
    if (!searchTerm || searchTerm.length === 0) {
      document.getElementById("client-search").value = "";
      loadClients(1);
      return;
    }
    showLoading("clients-content", `Ricerca di "${escapeHtml(searchTerm)}"...`);
    document.getElementById("clients-pagination").innerHTML = "";

    google.script.run
      .withSuccessHandler(displayClients)
      .withFailureHandler((error) => showClientError(error))
      .searchInSheets(searchTerm);
  }

  function showClientError(error) {
    showError("clients-content", error);
    document.getElementById("clients-pagination").innerHTML = "";
  }

  function displayClients(result) {
    const contentDiv = document.getElementById("clients-content");
    document.getElementById("clients-update-time").textContent =
      new Date().toLocaleString();

    if (!result || result.error) {
      showClientError(
        result ? result.error : "Errore sconosciuto nel caricamento clienti."
      );
      return;
    }

    const { clients, currentPage, totalPages, totalClients, isSearch } = result;

    const totalClientsSpan = document.getElementById("totalClientsCount");
    if (totalClientsSpan) {
      totalClientsSpan.textContent = totalClients;
    }

    if (!clients || clients.length === 0) {
      contentDiv.innerHTML = `<p class="empty-state">${
        isSearch
          ? "Nessun cliente trovato per i criteri di ricerca."
          : "Nessun cliente nel database."
      }</p>`;

      const paginationDiv = document.getElementById("clients-pagination");
      if (isSearch) {
        paginationDiv.innerHTML = `
                    <button class="search-button back-button" onclick="loadClients(1)">Torna alla lista completa</button>
                `;
      } else {
        paginationDiv.innerHTML = "";
      }
      return;
    }

    let html = "<ul>";
    clients.forEach((client) => {
      html += `
            <li class="client-card" data-name="${
              escapeHtml(client.name || "")
            }" data-phone="${escapeHtml(client.formattedPhone || client.phone || "")}">
              <div class="client-name">${
                escapeHtml(client.name || "Nome non disponibile")
              }</div>
              <div class="client-info">
                <div class="info-item">
                  <span class="info-label">Telefono</span>
                  <span class="info-value">${
                    escapeHtml(client.formattedPhone || client.phone || "Non disp.")
                  }</span>
                </div>
                <div class="info-item">
                  <span class="info-label">Ultimo appuntamento</span>
                  <span class="info-value">${escapeHtml(client.lastVisit || "Mai")}</span>
                </div>
                <div class="info-item">
                  <span class="info-label">Totale</span>
                  <span class="info-value">${escapeHtml(client.totalVisits || 0)}</span>
                </div>
              </div>
              </li>
          `;
    });
    html += "</ul>";
    contentDiv.innerHTML = html;

    setupClientCards();

    const paginationDiv = document.getElementById("clients-pagination");
    if (isSearch) {
      paginationDiv.innerHTML = `
                <button class="search-button back-button" onclick="loadClients(1)">Torna alla lista completa</button>
             `;
    } else {
      generatePagination(currentPage, totalPages);

      document.getElementById("client-search").value = "";
    }
  }

  function setupClientCards() {
    const contentArea = document.getElementById("clients-content");
    if (!contentArea) return;

    contentArea.addEventListener("click", function (e) {
      const card = e.target.closest(".client-card");
      if (!card) return;

      if (e.target.closest("a, button, input")) return;

      const clientName = card.dataset.name;
      const clientPhone = card.dataset.phone;

      if (clientName && clientPhone) {
        showHistoryPopup(clientName, clientPhone);
      } else {
        console.warn(
          "Impossibile recuperare nome o telefono dalla card:",
          card
        );
      }
    });
  }

  const historyModal = document.getElementById("history-modal");
  const modalTitle = document.getElementById("modal-title");
  const modalHistoryContent = document.getElementById("modal-history-content");

  function showHistoryPopup(clientName, clientPhone) {
    if (!historyModal || !modalTitle || !modalHistoryContent) {
      console.error("Elementi del popup non trovati!");
      return;
    }

    modalTitle.textContent = `${clientName}`;
    modalHistoryContent.innerHTML =
      '<div class="loading-history">Caricamento appuntamenti...</div>';
    historyModal.style.display = "flex";

    historyModal.addEventListener(
      "click",
      function (event) {
        if (event.target === historyModal) {
          closeHistoryPopup();
        }
      },
      { once: true }
    );

    google.script.run
      .withSuccessHandler((history) => {
        populateHistoryPopup(clientName, history);
      })
      .withFailureHandler((error) => {
        modalHistoryContent.innerHTML = `<div class="error-history">Errore caricamento storico: ${
          error.message || "Errore sconosciuto"
        }</div>`;
        console.error("Errore caricamento storico:", error);
      })
      .getClientHistory(clientName, clientPhone);
  }

  function populateHistoryPopup(clientName, history) {
    if (!modalHistoryContent) return;

    if (!history || history.length === 0) {
      modalHistoryContent.innerHTML = `<div class="empty-history">Nessun appuntamento registrato per ${escapeHtml(clientName)}</div>`;
      return;
    }

    let html = "<ul>";
    history.forEach((visit) => {
      html += `
            <li>
              <strong>${escapeHtml(visit.date || "N/D")}</strong> alle ${
        escapeHtml(visit.time || "N/D")
      }
              ${
                visit.notes
                  ? `<div style="font-size: 12px; color: var(--google-gray-5); margin-top: 4px;">${escapeHtml(visit.notes)}</div>`
                  : ""
              }
            </li>
          `;
    });
    html += "</ul>";
    modalHistoryContent.innerHTML = html;
  }

  function closeHistoryPopup() {
    if (historyModal) {
      historyModal.style.display = "none";

      if (modalHistoryContent) {
        modalHistoryContent.innerHTML = "";
      }
    }
  }

  function generatePagination(currentPage, totalPages) {
    const paginationDiv = document.getElementById("clients-pagination");
    if (!paginationDiv || totalPages <= 1) {
      if (paginationDiv) paginationDiv.innerHTML = "";
      return;
    }

    let paginationHtml = "";
    const maxPagesToShow = 3;

    paginationHtml += `<button class="page-button" ${
      currentPage <= 1 ? "disabled" : ""
    } onclick="loadClients(${
      currentPage - 1
    })" aria-label="Pagina precedente">&lt;</button>`;

    let startPage, endPage;
    if (totalPages <= maxPagesToShow) {
      startPage = 1;
      endPage = totalPages;
    } else {
      const maxPagesBeforeCurrent = Math.floor((maxPagesToShow - 3) / 2);
      const maxPagesAfterCurrent = Math.ceil((maxPagesToShow - 3) / 2);
      if (currentPage <= maxPagesBeforeCurrent + 1) {
        startPage = 1;
        endPage = maxPagesToShow - 1;
      } else if (currentPage + maxPagesAfterCurrent >= totalPages - 1) {
        startPage = totalPages - (maxPagesToShow - 2);
        endPage = totalPages;
      } else {
        startPage = currentPage - maxPagesBeforeCurrent;
        endPage = currentPage + maxPagesAfterCurrent;
      }
    }

    if (startPage > 1) {
      paginationHtml += `<button class="page-button" onclick="loadClients(1)" aria-label="Prima pagina">1</button>`;
      if (startPage > 2) {
        paginationHtml += `<button class="page-button" disabled style="cursor: default; background: transparent; border: none;">...</button>`;
      }
    } else {
      endPage = Math.min(totalPages, maxPagesToShow);
      startPage = 1;
    }

    for (let i = startPage; i <= Math.min(endPage, totalPages); i++) {
      if (i === 1 && startPage > 1) continue;
      if (i === totalPages && endPage < totalPages) continue;

      paginationHtml += `<button class="page-button ${
        i === currentPage ? "active" : ""
      }" onclick="loadClients(${i})" aria-label="Pagina ${i}" ${
        i === currentPage ? 'aria-current="page"' : ""
      }>${i}</button>`;
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        paginationHtml += `<button class="page-button" disabled style="cursor: default; background: transparent; border: none;">...</button>`;
      }
      paginationHtml += `<button class="page-button" onclick="loadClients(${totalPages})" aria-label="Ultima pagina">${totalPages}</button>`;
    } else if (startPage === 1 && totalPages > maxPagesToShow) {
      if (endPage < totalPages) {
        paginationHtml += `<button class="page-button" disabled style="cursor: default; background: transparent; border: none;">...</button>`;
        paginationHtml += `<button class="page-button" onclick="loadClients(${totalPages})" aria-label="Ultima pagina">${totalPages}</button>`;
      }
    }

    paginationHtml += `<button class="page-button" ${
      currentPage >= totalPages ? "disabled" : ""
    } onclick="loadClients(${
      currentPage + 1
    })" aria-label="Pagina successiva">&gt;</button>`;

    paginationDiv.innerHTML = paginationHtml;
  }

  function triggerSync() {
    const button = document.getElementById("sync-button");
    const statusContainer = document.getElementById("status-message");

    button.disabled = true;
    button.classList.add("syncing");

    if (statusContainer) {
      statusContainer.innerHTML = "";
      statusContainer.className = "status-container";
    }

    google.script.run
      .withSuccessHandler(onSyncSuccess)
      .withFailureHandler(onSyncFailure)
      .forceSyncAndUpdatePhones();
  }

  function onSyncSuccess(message) {
    const button = document.getElementById("sync-button");

    button.disabled = false;
    button.classList.remove("syncing");

    const selectedDay =
      document.querySelector(".day-option.selected").getAttribute("data-day") ||
      "tomorrow";
    loadAppointments(selectedDay);

    console.log("Sincronizzazione completata:", message);
  }

  function onSyncFailure(error) {
    const button = document.getElementById("sync-button");

    button.disabled = false;
    button.classList.remove("syncing");

    console.error("Errore durante la sincronizzazione:", error.message);
  }

  /* --- GESTIONE IMPOSTAZIONI ATTIVITÀ & PROMEMORIA --- */
  function openSettingsTab() {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));

    const settingsTab = document.getElementById("settings-tab");
    if (settingsTab) settingsTab.classList.add("active");

    const settingsBtn = document.getElementById("open-settings-btn");
    if (settingsBtn) settingsBtn.classList.add("active");

    const statusMsg = document.getElementById("settings-status-msg");
    if (statusMsg) {
      statusMsg.textContent = "";
      statusMsg.className = "settings-status-msg";
    }
    loadSalonSettings();
  }

  function switchToTab(tabName) {
    const tabEl = document.querySelector(`.tab[data-tab="${tabName}"]`);
    if (tabEl) {
      tabEl.click();
    }
    if (tabName === "reminders") {
      const selectedDay =
        document
          .querySelector(".day-option.selected")
          ?.getAttribute("data-day") || "tomorrow";
      loadAppointments(selectedDay);
    }
  }

  function toggleConfirmationSettingsFields() {
    const enabled = document.getElementById("setting-confirmation-enabled")?.checked;
    const daysGroup = document.getElementById("confirmation-days-group");
    if (daysGroup) {
      daysGroup.style.opacity = enabled ? "1" : "0.5";
      daysGroup.style.pointerEvents = enabled ? "auto" : "none";
    }
  }

  function toggleFinalSettingsFields() {
    const enabled = document.getElementById("setting-final-enabled")?.checked;
    const cont = document.getElementById("final-only-confirmed-container");
    if (cont) {
      cont.style.opacity = enabled ? "1" : "0.5";
      cont.style.pointerEvents = enabled ? "auto" : "none";
    }
  }

  function loadSalonSettings() {
    google.script.run
      .withSuccessHandler(onSalonSettingsLoaded)
      .withFailureHandler(function (err) {
        console.error("Errore caricamento impostazioni:", err);
      })
      .getSalonSettings();
  }

  function onSalonSettingsLoaded(settings) {
    if (!settings) return;
    currentSalonSettings = settings;

    const nameInput = document.getElementById("setting-salon-name");
    const logoInput = document.getElementById("setting-salon-logo");
    const confEnabledCheck = document.getElementById("setting-confirmation-enabled");
    const daysSelect = document.getElementById("setting-confirmation-days");
    const finalCheck = document.getElementById("setting-final-enabled");
    const onlyConfirmedSelect = document.getElementById("setting-final-only-confirmed");
    const tmplConfirm = document.getElementById("setting-template-confirmation");
    const tmplFinal = document.getElementById("setting-template-final");
    const sessionInput = document.getElementById("setting-waha-session");

    if (nameInput) nameInput.value = settings.salonName || "";
    if (logoInput) logoInput.value = settings.salonLogoUrl || "";
    if (sessionInput) sessionInput.value = settings.wahaSession || "default";
    if (confEnabledCheck) confEnabledCheck.checked = settings.confirmationLinksEnabled !== false;
    if (daysSelect) daysSelect.value = String(settings.confirmationDays !== undefined ? settings.confirmationDays : 2);
    if (finalCheck) finalCheck.checked = settings.finalReminderEnabled !== false;
    if (onlyConfirmedSelect) onlyConfirmedSelect.value = settings.finalReminderOnlyConfirmed ? "true" : "false";
    if (tmplConfirm) tmplConfirm.value = settings.messageTemplateConfirmation || "";
    if (tmplFinal) tmplFinal.value = settings.messageTemplateFinal || "";

    toggleConfirmationSettingsFields();
    toggleFinalSettingsFields();
    updateTopbarBrand(settings.salonName, settings.salonLogoUrl);
  }

  function updateTopbarBrand(salonName, logoUrl) {
    const nameEl = document.getElementById("topbar-salon-name");
    const logoImg = document.getElementById("topbar-logo-img");
    const logoIcon = document.getElementById("topbar-logo-icon");

    if (nameEl) nameEl.textContent = salonName || "Appuntamenti";

    if (logoImg && logoIcon) {
      if (logoUrl && logoUrl.trim().startsWith("http")) {
        logoImg.src = logoUrl.trim();
        logoImg.style.display = "block";
        logoIcon.style.display = "none";
        logoImg.onerror = function () {
          logoImg.style.display = "none";
          logoIcon.style.display = "flex";
        };
      } else {
        logoImg.style.display = "none";
        logoIcon.style.display = "flex";
      }
    }
  }

  function saveSettingsFromModal() {
    const btn = document.getElementById("btn-save-settings");
    const txt = document.getElementById("txt-save-settings");
    const statusMsg = document.getElementById("settings-status-msg");

    if (btn) btn.disabled = true;
    if (txt) txt.textContent = "Salvataggio...";
    if (statusMsg) {
      statusMsg.textContent = "";
      statusMsg.className = "settings-status-msg";
    }

    const confEnabled = document.getElementById("setting-confirmation-enabled") ? document.getElementById("setting-confirmation-enabled").checked : true;
    const confDays = parseInt(document.getElementById("setting-confirmation-days").value, 10);
    const wahaSessionEl = document.getElementById("setting-waha-session");
    const newSettings = {
      salonName: document.getElementById("setting-salon-name").value,
      salonLogoUrl: document.getElementById("setting-salon-logo").value,
      wahaSession: wahaSessionEl ? wahaSessionEl.value.trim() || 'default' : 'default',
      confirmationDays: confDays,
      confirmationLinksEnabled: confEnabled,
      finalReminderEnabled: document.getElementById("setting-final-enabled").checked,
      finalReminderOnlyConfirmed: document.getElementById("setting-final-only-confirmed").value === "true",
      messageTemplateConfirmation: document.getElementById("setting-template-confirmation").value,
      messageTemplateFinal: document.getElementById("setting-template-final").value
    };

    google.script.run
      .withSuccessHandler(function (res) {
        if (btn) btn.disabled = false;
        if (txt) txt.textContent = "Salva Impostazioni";
        if (statusMsg) {
          statusMsg.textContent = "Impostazioni salvate con successo!";
          statusMsg.className = "settings-status-msg success";
        }
        showToast("Impostazioni salvate con successo!", "success");
        currentSalonSettings.confirmationLinksEnabled = newSettings.confirmationLinksEnabled;
        currentSalonSettings.finalReminderEnabled = newSettings.finalReminderEnabled;
        updateTopbarBrand(newSettings.salonName, newSettings.salonLogoUrl);
        setTimeout(function () {
          switchToTab('reminders');
        }, 1200);
      })
      .withFailureHandler(function (err) {
        if (btn) btn.disabled = false;
        if (txt) txt.textContent = "Salva Impostazioni";
        if (statusMsg) {
          statusMsg.textContent = "Errore: " + (err.message || err);
          statusMsg.className = "settings-status-msg error";
        }
      })
      .saveSalonSettings(newSettings);
  }

  document.addEventListener("DOMContentLoaded", function () {
    const syncButton = document.getElementById("sync-button");
    if (syncButton) {
      syncButton.addEventListener("click", triggerSync);
    }
    loadSalonSettings();
  });
</script>
